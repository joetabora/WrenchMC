<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WrenchMC Goliath — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: #07090c;
        color: #e6e6e6;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 20px 18px;
        background: rgba(255, 255, 255, 0.04);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; opacity: 0.85; line-height: 1.45; }
      .hint { margin-top: 12px; font-size: 13px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>WrenchMC Goliath can’t reach the network right now. Reconnect and try again.</p>
      <p class="hint">Tip: once you're back online, reload to get the latest UI.</p>
    </div>
  </body>
</html>
